<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Captura de Afiliados</title>
  
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilo.css">

</head>
<body class="pb-5">

  <!-- Minimal Header -->
  <header class="bg-white border-bottom py-3 mb-4 sticky-top shadow-sm">
    <div class="container d-flex align-items-center justify-content-between" style="max-width: 760px;">
      <div class="d-flex align-items-center gap-2">
        <div class="bg-dark text-white rounded-2 d-flex align-items-center justify-content-center" style="width: 34px; height: 34px;">
          <i class="bi bi-person-vcard fs-5"></i>
        </div>
        <div>
          <span class="fw-bold text-dark fs-6 tracking-tight d-block lh-1">Captura de Afiliados</span>
          <span class="text-muted" style="font-size: 0.75rem;">Extraer datos de INE</span>
        </div>
      </div>
      

    </div>
  </header>

  <main class="container" style="max-width: 760px;">

    <!-- Heading Intro -->
    <!-- <div class="mb-4">
      <h1 class="h4 fw-bold text-dark mb-1">Captura nuevo registro</h1>
      <p class="text-muted small mb-0">Selecciona un promotor y adjunta la INE</p>
    </div> -->

    <!-- Alert / Status Notifications -->
    <div id="statusMessage" class="alert d-none py-2 px-3 rounded-3 small mb-3 shadow-sm" role="alert"></div>

    <form id="ineExtractionForm" onsubmit="event.preventDefault(); handleExtractData();">
      
      <!-- 1. SECCIÓN: PROMOTOR ASIGNADO -->
      <section class="card card-modern p-4 mb-3">
        <div class="d-flex align-items-center justify-content-between mb-2">
          <label for="promotorSelect" class="form-label-subtle m-0">
            <i class="bi bi-person-badge text-primary me-1"></i> 1. Promotor <span class="text-danger">*</span>
          </label>
        </div>
        <select class="form-select form-select-modern" id="promotorSelect" required>
          <option value="" disabled selected>Seleccione un promotor...</option>
          <option value="Carlos Mendoza — Zona Norte (PM-0104)">Carlos Mendoza - Barrio 1</option>
          <option value="Ana Sofía Ruiz — Zona Centro (PM-0219)">Ana Sofía Ruiz — Barrio 2</option>
          <option value="Mauricio Lozano — Zona Poniente (PM-0345)">Mauricio Lozano — Barrio 3</option>
          <option value="Valeria Gómez — Zona Sur (PM-0412)">Valeria Gómez — Zona Sur</option>
          <option value="Héctor Salgado — Ventas Remotas (PM-0087)">Héctor Salgado — Ventas Remotas</option>
        </select>
      </section>

      <!-- 2. SECCIÓN: CARGA DE ARCHIVO DE INE -->
      <section class="card card-modern p-4 mb-3">
        <div class="d-flex align-items-center justify-content-between mb-2">
          <label class="form-label-subtle m-0">
            <i class="bi bi-card-image text-primary me-1"></i> 2. Foto Frontal de la INE <span class="text-danger">*</span>
          </label>
          <span class="text-muted small" style="font-size: 0.75rem;">JPG, PNG, WebP (Máx. 10MB)</span>
        </div>

        <!-- Zona Drag & Drop -->
        <div id="dropZone" class="dropzone-container p-4 text-center">
          <input 
            type="file" 
            id="ineFileInput" 
            class="d-none" 
            accept="image/jpeg,image/png,image/webp,application/pdf"
          >
          <div class="py-2">
            <i class="bi bi-cloud-arrow-up fs-2 text-secondary mb-2 d-block"></i>
            <p class="fw-semibold text-dark small mb-1">Arrastra la imagen del INE aquí</p>
            <p class="text-muted small mb-3" style="font-size: 0.8rem;">o pulsa para examinar en tu dispositivo</p>
            <button type="button" class="btn btn-outline-secondary btn-sm px-3 rounded-2" onclick="triggerFileInput()">
              <i class="bi bi-camera me-1"></i> Explorar Archivo
            </button>
          </div>
        </div>

        <!-- Vista previa compacta -->
        <div id="filePreviewSection" class="p-3 bg-light border rounded-3 mt-3 d-none">
          <div class="d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3 overflow-hidden">
              <img id="previewImg" src="" alt="Vista previa" class="rounded border object-fit-cover d-none" style="width: 58px; height: 58px;">
              <div id="previewPdfIcon" class="rounded bg-danger-subtle text-danger d-none align-items-center justify-content-center" style="width: 58px; height: 58px;">
                <i class="bi bi-file-earmark-pdf fs-4"></i>
              </div>
              <div class="overflow-hidden">
                <div class="fw-semibold text-truncate small text-dark" id="fileName">archivo.jpg</div>
                <div class="text-muted small" id="fileSize">0 KB</div>
              </div>
            </div>
            <button type="button" class="btn btn-sm btn-outline-danger border-0 rounded-circle" title="Remover archivo" onclick="removeSelectedFile()">
              <i class="bi bi-x-lg"></i>
            </button>
          </div>
        </div>
      </section>


      <!-- Botón de Extracción Principal -->
      <div class="d-grid mb-4">
        <button type="submit" id="btnProcess" class="btn btn-dark py-2 px-4 rounded-3 d-flex align-items-center justify-content-center gap-2">
          <i class="bi bi-cpu"></i>
          <span id="btnProcessText">Extraer Datos de INE</span>
        </button>
      </div>
    </form>

    <!-- 4. SECCIÓN: RESULTADOS DE EXTRACCIÓN (Oculto inicialmente) -->
    <section id="resultsCard" class="card card-modern p-4 d-none fade-slide-in">

      <!-- Formulario con campos extraídos de la credencial -->
      <form id="extractedDataForm" onsubmit="event.preventDefault(); saveFinalRecord();">
        <div class="row g-3">
          
          <!-- Nombre(s) -->
          <div class="col-md-4">
            <label class="form-label-subtle">Nombre(s)</label>
            <input type="text" id="resNombre" class="form-control form-control-modern" required>
          </div>

          <!-- Apellido Paterno -->
          <div class="col-md-4">
            <label class="form-label-subtle">Primer Apellido (Paterno)</label>
            <input type="text" id="resApellidoPaterno" class="form-control form-control-modern" required>
          </div>

          <!-- Apellido Materno -->
          <div class="col-md-4">
            <label class="form-label-subtle">Segundo Apellido (Materno)</label>
            <input type="text" id="resApellidoMaterno" class="form-control form-control-modern">
          </div>

          <!-- CURP -->
          <div class="col-md-6">
            <label class="form-label-subtle">CURP</label>
            <input type="text" id="resCurp" class="form-control form-control-modern font-monospace text-uppercase" maxlength="18" required>
          </div>

          <!-- Clave de Elector -->
          <div class="col-md-6">
            <label class="form-label-subtle">Clave de Elector</label>
            <input type="text" id="resClaveElector" class="form-control form-control-modern font-monospace text-uppercase" maxlength="18" required>
          </div>

          <!-- Domicilio Completo -->
          <!-- <div class="col-12">
            <label class="form-label-subtle">Domicilio Completo</label>
            <input type="text" id="resDomicilio" class="form-control form-control-modern" required>
          </div> -->

          <!-- Calle y Colonia -->
          <div class="col-md-6">
            <label class="form-label-subtle">Calle</label>
            <input type="text" id="resCalle" class="form-control form-control-modern">
          </div>

          <div class="col-md-6">
            <label class="form-label-subtle">Colonia</label>
            <input type="text" id="resColonia" class="form-control form-control-modern">
          </div>

          <!-- Municipio, Estado y C.P. -->
          <div class="col-md-5">
            <label class="form-label-subtle">Municipio / Alcaldía</label>
            <input type="text" id="resMunicipio" class="form-control form-control-modern">
          </div>

          <div class="col-md-4">
            <label class="form-label-subtle">Estado</label>
            <input type="text" id="resEstado" class="form-control form-control-modern">
          </div>

          <div class="col-md-3">
            <label class="form-label-subtle">Código Postal</label>
            <input type="text" id="resCodigoPostal" class="form-control form-control-modern font-monospace" maxlength="5">
          </div>

          <!-- Nacimiento, Sexo, Sección -->
          <div class="col-md-4">
            <label class="form-label-subtle">Fecha de Nacimiento</label>
            <input type="text" id="resFechaNacimiento" class="form-control form-control-modern" placeholder="DD/MM/AAAA">
          </div>

          <div class="col-md-4">
            <label class="form-label-subtle">Sexo</label>
            <select id="resSexo" class="form-select form-select-modern">
              <option value="H">Hombre (H)</option>
              <option value="M">Mujer (M)</option>
              <option value="X">No Binario (X)</option>
            </select>
          </div>

          <div class="col-md-4">
            <label class="form-label-subtle">Sección Electoral</label>
            <input type="text" id="resSeccion" class="form-control form-control-modern font-monospace">
          </div>

          <!-- Vigencia, Emisión, Año Registro -->
          <div class="col-md-4">
            <label class="form-label-subtle">Vigencia</label>
            <input type="text" id="resVigencia" class="form-control form-control-modern font-monospace">
          </div>

          <div class="col-md-4">
            <label class="form-label-subtle">Emisión</label>
            <input type="text" id="resEmision" class="form-control form-control-modern font-monospace">
          </div>

          <div class="col-md-4">
            <label class="form-label-subtle">Año de Registro</label>
            <input type="text" id="resAnioRegistro" class="form-control form-control-modern font-monospace">
          </div>

          <!-- Códigos OCR / CIC (opcional) -->
          <!-- <div class="col-md-6">
            <label class="form-label-subtle">Código OCR</label>
            <input type="text" id="resOcr" class="form-control form-control-modern font-monospace small">
          </div>

          <div class="col-md-6">
            <label class="form-label-subtle">CIC</label>
            <input type="text" id="resCic" class="form-control form-control-modern font-monospace small">
          </div> -->
        </div>

        <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mt-4 pt-3 border-top">
          <button type="button" class="btn btn-outline-secondary rounded-2 btn-sm px-3" onclick="resetAll()">
            <i class="bi bi-arrow-counterclockwise me-1"></i> Limpiar y Agregar
          </button>
          <button type="submit" id="btnSaveRecord" class="btn btn-primary rounded-2 btn-sm px-4 d-flex align-items-center gap-2">
            <i class="bi bi-cloud-arrow-up"></i>
            <span>Guardar Datos</span>
          </button>
        </div>
      </form>
    </section>

    <!-- Footer -->
    <footer class="text-center text-muted small mt-5 pt-3">
      Extracción de Datos INE - @ever2812
        <!-- Integración con https://extraerdatosdeine.com @ever2812 -->
    </footer>
  </main>

  <!-- Bootstrap Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>


</body>
</html>
